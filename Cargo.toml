[workspace]
resolver = "2"
members = ["crates/pdf", "crates/pybind", "crates/render"]

[workspace.package]
# THE version of document-lab: maturin reads it for the Python package, and a release tag must match.
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
pdf = { path = "crates/pdf" }
render = { path = "crates/render" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[workspace.lints.clippy.all]
level = "deny"
priority = -1

[workspace.lints.clippy.pedantic]
level = "warn"
priority = -1
[profile.release]
lto = true
codegen-units = 1
