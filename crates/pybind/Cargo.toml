[package]
name = "pybind"
version.workspace = true
edition.workspace = true
license.workspace = true

# The Python extension `document_lab._pdf`: thin glue over `pdf`, no PDF logic of its own.
[lib]
name = "_pdf"
crate-type = ["cdylib"]

[dependencies]
pdf.workspace = true
render.workspace = true
pyo3 = { version = "0.29", features = ["extension-module"] }

