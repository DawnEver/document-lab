# The repo's own placement, beyond the family's (dev_lab.dev.codeplace): its keys, then [layout].
# A worktree is a real second tree, judged by the run inside it.
pruned_paths = ['.claude/worktrees']
# The Rust crates are code, beyond the family's roots.
code_roots = ['crates/']

# DECLARED-LAYOUT (dev_lab.dev.layout): the WHOLE tree as an allow-list -- each directory pattern (one glob per
# segment; the deepest matching row judges) and the formats a file there may be ('.suffix', an exact name, "" for
# none, "*" for anything). Undeclared is refused. NO-BACKUP-COPIES: nothing under output/ or scratch/ is ever a
# clone, worktree, exported tree, bundle or patch, whatever a row says. Formats (R3): TOML declarations, JSONL
# machine records, CSV tables, NPZ arrays, Markdown reports, PNG figures; vendor-native only at an adapter boundary.

[layout]
'.' = ['.md', '.toml', '.lock', '.gitattributes', '.gitignore', '.rgignore', 'license', 'makefile']
'.claude' = ['.json']
'.claude/hooks' = ['.js', '.json']
'.claude/memory' = ['.md']
'.claude/rules' = ['.md']
'.claude/tasks' = ['.md']
'.codex' = []
'.codex/rules' = ['.rules']
'.github' = []
'.github/workflows' = ['.yml']
'docs-src' = ['.md']
'output' = []
'output/forge' = []
'output/forge/*' = ['.json', '.tmp']
'output/logs' = []
'output/logs/[0-9][0-9]/[0-9][0-9]/[0-9][0-9]/*' = ['.log', '.jsonl', '.json', '.gz', '.coverage', '.txt', '.csv', '.md', '.npz', '.png']
'output/runcache' = ['.jsonl']
'output/cache' = []
'output/cache/corpus' = ['.pdf']  # the corpus part's fetched sources, each named by its sha256
'scratch' = ['*']
'scripts' = ['.py']
'src' = ['.py']
'tests' = ['.py']
'tests/paper' = ['.py', '.pdf']
'.claude/memory/[0-9][0-9][0-9][0-9]' = []
'.claude/memory/[0-9][0-9][0-9][0-9]/[0-9][0-9]' = []
'.claude/memory/[0-9][0-9][0-9][0-9]/[0-9][0-9]/[0-9][0-9]' = ['.md']
'.vscode' = ['.json']
'crates' = []
'crates/*' = ['.toml']
'crates/*/src' = ['.rs', '.hex']
'crates/*/src/*' = ['.bin', '.txt']  # the pdf crate's CMap and CID-to-Unicode tables
'crates/*/examples' = ['.rs']
'crates/*/tests' = ['.rs']
'crates/*/tests/common' = ['.rs']
'crates/*/tests/fixtures' = ['.pdf', '.py']  # synthetic fixtures and the script that makes them
'crates/*/data' = ['.py']  # generators of the crate's data tables
'src/document_lab' = ['.py', '.pyd', '.so', '.pdb']  # .pyd/.so: the Rust extension maturin builds in place; .pdb: its Windows debug symbols
'src/document_lab/*' = ['.py']
'tests/*' = ['.py']
'tests/paper/e2e' = ['.py']
