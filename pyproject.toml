[build-system]
requires = ["maturin>=1.7"]
build-backend = "maturin"

[project]
name = "document_lab"
# The version is the Cargo workspace's (`Cargo.toml`), read by maturin; a release tag must match it.
dynamic = ["version"]
license = "MIT"
license-files = ["LICENSE"]
description = "Documents (PDF, HTML tables) to typed data that carries its provenance"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Mingyang Bao" }]
# The package's own Rust crate (`document_lab._pdf`) reads PDFs and writes captures; PyMuPDF renders a region to
# pixels and lays the OCR layer; numpy carries the digitised curves.
# lab-commons supplies what the family already owns: the output location and logging.
dependencies = [
    "lab-commons[paths] @ git+https://github.com/DawnEver/lab-commons.git",
    "numpy",
    # Below 2: PyMuPDF 2.x requires pymupdf4llm, pymupdf-layout and onnxruntime, and onnxruntime has no cp315
    # wheel (measured 2026-11-05 on 2.1). 1.x is the whole reader this package needs.
    "pymupdf<2",
]

[project.optional-dependencies]
# `document-lab paper` through marker-pdf when a GPU with >= 4 GB VRAM is present (else the base package's IR path).
gpu = ["marker-pdf"]
# Values a model reads out of a document (`document_lab.ai`), through the family's one model interface.
ai = ["ai_lab @ git+https://github.com/DawnEver/ai-lab.git"]
# `document_lab.capture` / `document-lab capture`: a window or screen region, scrolled and stitched, to a PDF. Windows
# only, and it needs nothing beyond the base: ctypes drives the desktop, tkinter draws the region overlay, the
# package's own writer (`document_lab._pdf`) writes the PDF. The extra names the capability so a consumer can depend on it explicitly.
capture = []
# The family's development kit: rules registry, rendered configs, shared test bodies, verify entry.
dev = [
    # The build backend: this repo's own tool, not the test kit's.
    "maturin>=1.7",
    "dev-lab[test] @ git+https://github.com/DawnEver/dev-lab.git",
    "document_lab[ai]",
    "pytest",
    "ruff",
]

[project.scripts]
document-lab = "document_lab.__main__:main"

[tool.uv]
# User ruling 2026-11-07: force pillow and filelock past the caps marker-pdf 2.1.0 (`pillow<11`) and surya-ocr 0.23.0
# (`filelock<4`, `pillow<11`) declare -- both reached only through the `gpu` extra -- to clear 95 OSV advisories
# (pillow 10.4.0: 82, fixed in 13.0.0; filelock 3.32.7: 13, fixed in 4.2.1). If the gpu tests break, accept instead.
override-dependencies = ["pillow>=13", "filelock>=4.2.1"]
# uv keys a path build on pyproject.toml's mtime alone; the mixed wheel must rebuild for a Rust OR a Python edit.
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "crates/**/*.rs" }, { file = "src/**/*.py" }]

[tool.maturin]
python-source = "src"
module-name = "document_lab._pdf"
manifest-path = "crates/pybind/Cargo.toml"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: converts with marker-pdf on a CUDA GPU: its own part (tests/gpu), never tests/base",
    "vendor: reads the real document DOCUMENT_LAB_VENDOR_PDF names: its own part (tests/vendor), never tests/base",
    "papers: ingests the real papers in the directory DOCUMENT_LAB_PAPERS names: its own part (tests/paper/e2e), never tests/base",
    "reference: reads the real PDFs DOCUMENT_LAB_REFERENCE_PDFS names, against PyMuPDF: its own part (tests/reference), never tests/base",
    "windows: drives a real window on the Windows desktop: its own part (tests/windows), never tests/base",
    "ocr: lays a Tesseract text layer over a capture: its own part (tests/ocr), never tests/base",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = [
    "A", "AIR", "ANN", "ARG", "ASYNC", "B", "BLE", "C4", "C90", "COM", "D", "DJ", "DTZ", "E", "EM", "ERA",
    "F", "FA", "FBT", "FIX", "FLY", "FURB", "G", "I", "ICN", "INP", "INT", "ISC", "LOG", "N", "NPY", "PD",
    "PERF", "PGH", "PIE", "PLC", "PLE", "PLR", "PLW", "PT", "PTH", "PYI", "Q", "RET", "RSE", "RUF", "S",
    "SIM", "SLF", "SLOT", "T10", "T20", "TD", "TID", "TRY", "UP", "W", "YTT",
]
ignore = ["COM812", "D203", "D213", "D400", "D401", "N818", "PLR0913", "Q000", "Q003", "S603"]

[tool.ruff.lint.per-file-ignores]
# A test asserts, reads private seams of what it tests, and names fixtures rather than documenting them.
# The layout heuristics (the paper port absorbed from paper_pdf_ingest, and its IR markdown writer): their thresholds are measured page-geometry
# constants read inline, their branching IS the heuristic, and its re.sub callbacks run synchronously in the loop.
"src/document_lab/{paper/**,markdown.py}" = ["PLR2004", "C901", "PLR0911", "PLR0912", "PLR0915", "PLR0917", "FBT001", "FBT002", "B023"]
"tests/**" = ["S101", "SLF001", "D", "ANN", "ARG", "FBT003", "PLR2004", "PT018", "INP001"]
# A crate's generator (of its test fixtures, of its data tables) is a script beside its output, not a package.
"crates/*/{tests/fixtures,data}/*.py" = ["INP001"]

[tool.dev_lab.branchset]
trunk = 'main'
sessions = ['integrate/main']
ephemeral = ['pr/*']  # a PR head: deleted with its merge
prune_merged = true
max_ahead = 30  # an unlanded branch holding more than 30 commits integration lacks is an alarm
max_idle = "24 h"  # a branch idle 24 h is pruned when merged, alarmed when not

[tool.dev_lab.parts]
output = "output/logs"
# No resource exists on a hosted runner: `gpu` needs a CUDA GPU and the gpu extra, `vendor` a vendor PDF and
# `papers` the real papers and `reference` a corpus of real PDFs, none of which may be committed (the repo is
# public), `ocr` Tesseract with English data. This repo's tests run on GitHub Actions alone (user ruling 2026-11-11),
# so no part here produces them: they stay marked, and a consumer's unified run selects them by marker.
unproduced = ["gpu", "vendor", "papers", "reference", "ocr"]

# The extras every environment carries: `dev` (the kit, pytest, ruff; it carries `ai`). `gpu` (marker-pdf -> torch)
# is installed only for an environment whose need-set holds the `gpu` resource marker; `capture` is empty.
[tool.dev_lab.dep]
extras = ["dev"]
needs = { gpu = "gpu" }

[tool.lab_commons.tests]
produce = ["-m", "dev_lab.dev.verify", "--part", "{part}"]
resources = ["gpu", "vendor", "papers", "reference", "ocr", "windows"]

# The family branch flow: integrate/main coordinates; main moves only by `integrate promote` (fast-forward).
[tool.dev_lab.integrator]
trunk = "main"
integration = "integrate/main"
pr_merges_since = "d9199c9cf905a0e21bea1d43746a3caeeff07d24"  # INTEGRATION-TAKES-ONLY-FORGE-MERGES after this sha
merges_only_since = "bd7950d9a35321edef37c71f40c85a22fd009e00"  # INTEGRATION-IS-MERGES-ONLY from the first publication

# FORGE-PROTECTION-DECLARED (dev_lab.dev.forgeprotect): the ONE bypass identity per forge; on GitHub the
# repo admin (integrator ruling 2026-11-10). `python -m dev_lab.dev.forge protect plan|check|apply`.
[tool.dev_lab.protection]
[tool.dev_lab.protection.forges."github.com"]
breakglass = ["app:5704921", "role:admin"]  # the ops App merges break-glass; admin stays

# GitHub Actions: the family's one PR lifecycle (dev_lab/dev/ci_base.toml) as is; rendered to
# .github/workflows/ci.yml by `python -m dev_lab.dev.ciworkflows render`, never hand-edited.
[tool.dev_lab.ci."ci.yml"]

# Git hooks: the family base (dev_lab/dev/githooks/base.toml) plus one merged row. The lock is generated and
# exceeds the 500 KB large-files bound because the `gpu` extra (marker-pdf -> torch) resolves in it; the size check guards against
# committed blobs, which a lock is not.
[tool.dev_lab.env]
entry = ["src/document_lab/__main__.py", "src/document_lab/capture/cli.py"]
pending = []

[tool.dev_lab.hooks]

[[tool.dev_lab.hooks.pre-commit]]
id = "filechecks"
# The base row restated with two narrowings: large-files passes the lock file; the text checks pass every PDF,
# which is bytes (a cross-reference row ends in a space the format requires) even when no NUL marks it binary.
run = [
    "python", "-m", "dev_lab.dev.filechecks", "all",
    "--exclude", 'large-files=^uv\.lock$',
    "--exclude", 'trailing-whitespace=\.pdf$',
]

[tool.dev_lab.doors]
BARE-TEST-INVOCATION = "<venv python> -m dev_lab.dev.verify [-- <pytest args>]  (the verdict door; a hand-written pytest line has none)"
PUSH-NO-VERIFY = "<venv python> -m dev_lab.dev.verify, then push without skipping the hook"
NETWORK-VERB = "<venv python> -m dev_lab.dev.netverb -- <git push|fetch|pull|clone|ls-remote|submodule update ...  or  uv lock|add|remove ...>  (retries 3x, then reports a diagnosis); an environment change is <venv python> -m dev_lab.dev.dep --sync, which retries inside"
ENV-MUTATION-THROUGH-THE-DOOR = "<any family venv python> -m dev_lab.dev.dep --bootstrap <this checkout> --extra dev  (run from this checkout)"

[tool.dev_lab.render]
# What the family renderers read from this repo (dev_lab.dev.famfiles.RENDERERS); a relock re-runs each one due.
deltas = "tests/architecture/_famconfig.py"
adoption = "scripts/deny_rules.py"

# Who reviews this repo's PRs: the family's isolated judge host (user ruling 2026-11-10), gated on GitHub by the
# family App's review/judge check run. Keys and defaults: dev_lab.dev.forgereview_declared.
[tool.dev_lab.review]
judge_app = 5619495

# DECLARED-LAYOUT (dev_lab.dev.layout): the WHOLE tree as an allow-list -- each directory pattern (one glob per
# segment; the deepest matching row judges) and the formats a file there may be ('.suffix', an exact name, "" for
# none, "*" for anything). Undeclared is refused. NO-BACKUP-COPIES: nothing under output/ or scratch/ is ever a
# clone, worktree, exported tree, bundle or patch, whatever a row says. Formats (R3): TOML declarations, JSONL
# machine records, CSV tables, NPZ arrays, Markdown reports, PNG figures; vendor-native only at an adapter boundary.
[tool.dev_lab.placement]
# A worktree is a real second tree, judged by the run inside it.
pruned_paths = ['.claude/worktrees']

[tool.dev_lab.placement.layout]
'.' = ['.md', '.toml', '.lock', '.gitattributes', '.gitignore', '.rgignore', 'license', 'makefile']
'.claude' = ['.json']
'.claude/hooks' = ['.js', '.json']
'.claude/memory' = ['.md']
'.claude/rules' = ['.md']
'.claude/tasks' = ['.md']
'.codex' = []
'.codex/rules' = ['.rules']
'.github' = []
'.github/workflows' = ['.yml']
'docs-src' = ['.md']
'output' = []
'output/forge' = []
'output/forge/*' = ['.json', '.tmp']
'output/logs' = []
'output/logs/[0-9][0-9]/[0-9][0-9]/[0-9][0-9]/*' = ['.log', '.jsonl', '.json', '.gz', '.coverage', '.txt', '.csv', '.md', '.npz', '.png']
'output/runcache' = ['.jsonl']
'scratch' = ['*']
'scripts' = ['.py']
'src' = ['.py']
'tests' = ['.py']
'tests/paper' = ['.py', '.pdf']
