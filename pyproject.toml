[build-system]
requires = ["setuptools>=77.0.3", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "document_lab"
dynamic = ["version"]
license = "MIT"
license-files = ["LICENSE"]
description = "Documents (PDF, HTML tables) to typed data that carries its provenance"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Mingyang Bao" }]
# PyMuPDF reads the PDF (text, vector drawings, tables, images); numpy carries the digitised curves.
# lab-commons supplies what the family already owns: the output location and logging.
dependencies = [
    "lab-commons[paths] @ git+https://github.com/DawnEver/lab-commons.git",
    "numpy",
    # Below 2: PyMuPDF 2.x requires pymupdf4llm, pymupdf-layout and onnxruntime, and onnxruntime has no cp315
    # wheel (measured 2026-11-05 on 2.1). 1.x is the whole reader this package needs.
    "pymupdf<2",
]

[project.optional-dependencies]
# `document-lab paper` through marker-pdf when a GPU with >= 4 GB VRAM is present (else the base package's IR path).
gpu = ["marker-pdf"]
# Values a model reads out of a document (`document_lab.ai`), through the family's one model interface.
ai = ["ai_lab @ git+https://github.com/DawnEver/ai-lab.git"]
# `document_lab.capture` / `document-lab capture`: a window or screen region, scrolled and stitched, to a PDF. Windows
# only, and it needs nothing beyond the base: ctypes drives the desktop, tkinter draws the region overlay, PyMuPDF
# writes the PDF. The extra names the capability so a consumer can depend on it explicitly.
capture = []
# The family's development kit: rules registry, rendered configs, shared test bodies, verify entry.
dev = [
    "dev-lab[test] @ git+https://github.com/DawnEver/dev-lab.git",
    "document_lab[ai]",
    "pytest",
    "ruff",
]

[project.scripts]
document-lab = "document_lab.__main__:main"

[tool.setuptools_scm]
version_file = "src/document_lab/__version__.py"
fallback_version = "0.0.0"

[tool.setuptools.packages.find]
where = ["src"]
include = ["document_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: converts with marker-pdf on a CUDA GPU: its own part (tests/gpu), never tests/base",
    "vendor: reads the real document DOCUMENT_LAB_VENDOR_PDF names: its own part (tests/vendor), never tests/base",
    "windows: drives a real window on the Windows desktop: its own part (tests/windows), never tests/base",
    "ocr: lays a Tesseract text layer over a capture: its own part (tests/ocr), never tests/base",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = [
    "A", "AIR", "ANN", "ARG", "ASYNC", "B", "BLE", "C4", "C90", "COM", "D", "DJ", "DTZ", "E", "EM", "ERA",
    "F", "FA", "FBT", "FIX", "FLY", "FURB", "G", "I", "ICN", "INP", "INT", "ISC", "LOG", "N", "NPY", "PD",
    "PERF", "PGH", "PIE", "PLC", "PLE", "PLR", "PLW", "PT", "PTH", "PYI", "Q", "RET", "RSE", "RUF", "S",
    "SIM", "SLF", "SLOT", "T10", "T20", "TD", "TID", "TRY", "UP", "W", "YTT",
]
ignore = ["COM812", "D203", "D213", "D400", "D401", "N818", "PLR0913", "Q000", "Q003", "S603"]

[tool.ruff.lint.per-file-ignores]
# A test asserts, reads private seams of what it tests, and names fixtures rather than documenting them.
# The paper port's layout heuristics (absorbed from paper_pdf_ingest): their thresholds are measured page-geometry
# constants read inline, their branching IS the heuristic, and its re.sub callbacks run synchronously in the loop.
"src/document_lab/paper/**" = ["PLR2004", "C901", "PLR0911", "PLR0912", "PLR0915", "PLR0917", "FBT001", "FBT002", "B023"]
"tests/**" = ["S101", "SLF001", "D", "ANN", "ARG", "FBT003", "PLR2004", "PT018", "INP001"]

[tool.dev_lab.branchset]
trunk = 'main'
sessions = ['integrate/main']
prune_merged = true

[tool.lab_commons.hpc]
# PIN + FRESHNESS (user ruling 2026-10-17): the venv is exactly the committed lock, and the lock keys it.
install = 'uv sync --frozen --extra dev'
dependency_inputs = ['pyproject.toml', 'uv.lock']
source_roots = ['src']
collect = 'tests'

[tool.dev_lab.parts]
output = "output/logs"
# No resource exists on a hosted runner: `gpu` needs a CUDA GPU and the gpu extra, `vendor` a vendor PDF that may
# never be committed, `ocr` Tesseract with English data. Each is produced
# where it exists, by hand; base never selects them.
unproduced = ["gpu", "vendor", "ocr"]

[tool.lab_commons.tests]
produce = ["-m", "dev_lab.dev.verify", "--part", "{part}"]
resources = ["gpu", "vendor", "ocr", "windows"]

# The family branch flow: integrate/main coordinates; main moves only by `integrate promote` (fast-forward).
[tool.dev_lab.integrator]
trunk = "main"
integration = "integrate/main"
merges_only_since = "bd7950d9a35321edef37c71f40c85a22fd009e00"  # INTEGRATION-IS-MERGES-ONLY from the first publication

# GitHub Actions: the family's one PR lifecycle (dev_lab/dev/ci_base.toml) as is; rendered to
# .github/workflows/ci.yml by `python -m dev_lab.dev.ciworkflows render`, never hand-edited.
[tool.dev_lab.ci."ci.yml"]

# The setup every job shares, with the base's `--all-extras` narrowed to the extras a HOSTED runner uses: `dev`
# (which carries `ai`). `gpu` is an unproduced part ([tool.dev_lab.parts]); installing it on a hosted runner only
# built marker-pdf's pillow from source and failed `parts` (e0b6e02). The same install [tool.lab_commons.hpc] runs.
[tool.dev_lab.ci._steps]
setup = [
    { uses = "actions/checkout@v4", with = { ref = "${{ env.HEAD_SHA }}", fetch-depth = 0 } },
    { name = "Install uv", uses = "astral-sh/setup-uv@v5", with = { enable-cache = true } },
    { name = "Sync the environment", run = "uv sync --frozen --extra dev" },
]

# Git hooks: the family base (dev_lab/dev/githooks/base.toml) plus one merged row. The lock is generated and
# measures 532 KB because the `gpu` extra (marker-pdf -> torch) resolves in it; the size check guards against
# committed blobs, which a lock is not.
[tool.dev_lab.hooks]

[[tool.dev_lab.hooks.pre-commit]]
id = "check-added-large-files"
# Also the three papers the paper e2e goldens were measured on (paper_pdf_ingest's own test data, up to 1.6 MB).
exclude = '^(uv\.lock|tests/paper/data/[^/]+\.pdf)$'

[tool.dev_lab.doors]
BARE-TEST-INVOCATION = "<venv python> -m dev_lab.dev.verify [-- <pytest args>]  (the verdict door; a hand-written pytest line has none)"
PUSH-NO-VERIFY = "<venv python> -m dev_lab.dev.verify, then push without skipping the hook"
NETWORK-VERB = "<venv python> -m dev_lab.dev.netverb -- <git push|fetch|pull|clone|ls-remote|submodule update ...  or  uv lock|add|remove ...>  (retries 3x, then reports a diagnosis); an environment change is <venv python> -m dev_lab.dev.dep --sync, which retries inside"
ENV-MUTATION-THROUGH-THE-DOOR = "<any family venv python> -m dev_lab.dev.dep --bootstrap <this checkout> --extra dev  (run from this checkout)"

# Advisories accepted, each with its reason: every one is reached only through the `gpu` extra (marker-pdf 2.1.0,
# surya-ocr 0.23.0, their latest releases), which caps pillow <11 and filelock <4 below the fixed versions. No hosted
# run and no capture installs `gpu`; lift these when marker-pdf and surya-ocr allow pillow >=13 and filelock >=4.2.1.
[tool.dev_lab.security.accepted]
